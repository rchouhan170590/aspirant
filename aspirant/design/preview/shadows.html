<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shell.css"></head>
<body class="ds-base" style="background:var(--bg-canvas);padding:32px">

    <div class="col fill" style="gap:10px">
      <div style="height:80px;background:var(--bg-surface);border-radius:8px;border:1px solid var(--border-1);box-shadow:0 1px 2px rgba(26,31,46,0.06)"></div>
      <div class="label-row"><span style="font-weight:600">shadow-1</span><span class="mono" style="font-size:11px">0 1px 2px / 6%</span></div>
      <div class="meta">Resting cards (rare — borders preferred)</div>
    </div>
    <div class="col fill" style="gap:10px">
      <div style="height:80px;background:var(--bg-surface);border-radius:8px;box-shadow:0 8px 24px rgba(26,31,46,0.10)"></div>
      <div class="label-row"><span style="font-weight:600">shadow-2</span><span class="mono" style="font-size:11px">0 8px 24px / 10%</span></div>
      <div class="meta">Modals · popovers · dropdowns</div>
    </div>
  </div>
</body></html>
