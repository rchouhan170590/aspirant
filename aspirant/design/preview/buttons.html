<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shell.css">
<style>
.btn { font: 500 14px/1 var(--font-sans); padding: 10px 16px; border-radius: 4px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn-primary { background: var(--ink); color: var(--paper-white); }
.btn-secondary { background: transparent; color: var(--ink); border-color: var(--border-1); }
.btn-ghost { background: transparent; color: var(--ink); }
.btn-accent { background: var(--marigold); color: var(--paper-white); }
.btn-danger { background: transparent; color: var(--vermillion); border-color: var(--vermillion); }
</style>
</head>
<body class="ds-base">
  <div class="row" style="gap:10px;flex-wrap:wrap;align-items:center">
    <button class="btn btn-primary">Generate digest</button>
    <button class="btn btn-secondary">Open archive</button>
    <button class="btn btn-ghost">Cancel</button>
    <button class="btn btn-accent">Mark for revision</button>
    <button class="btn btn-danger">Reset attempts</button>
  </div>
  <div class="meta" style="margin-top:16px">Primary · Secondary · Ghost · Accent · Danger. Sentence-case labels. 14px Inter 500. Press: translateY(1px). Focus: 2px Marigold outline, 2px offset.</div>
</body></html>
