<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shell.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
.icon-cell { display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 8px; border:1px solid var(--border-2); border-radius:6px; }
.icon-cell svg { width:22px; height:22px; stroke:var(--ink); stroke-width:1.5; }
.icon-cell .lbl { font:500 11px/1 var(--font-mono); color:var(--fg-3); }
</style>
</head>
<body class="ds-base">
  <div class="row" style="gap:8px;flex-wrap:wrap">
    <div class="icon-cell" style="flex:1;min-width:90px"><i data-lucide="newspaper"></i><span class="lbl">newspaper</span></div>
    <div class="icon-cell" style="flex:1;min-width:90px"><i data-lucide="book-open-text"></i><span class="lbl">book</span></div>
    <div class="icon-cell" style="flex:1;min-width:90px"><i data-lucide="search"></i><span class="lbl">search</span></div>
    <div class="icon-cell" style="flex:1;min-width:90px"><i data-lucide="sparkles"></i><span class="lbl">spark</span></div>
    <div class="icon-cell" style="flex:1;min-width:90px"><i data-lucide="bookmark"></i><span class="lbl">bookmark</span></div>
    <div class="icon-cell" style="flex:1;min-width:90px"><i data-lucide="flame"></i><span class="lbl">flame</span></div>
    <div class="icon-cell" style="flex:1;min-width:90px"><i data-lucide="quote"></i><span class="lbl">quote</span></div>
  </div>
  <div class="meta" style="margin-top:14px">Lucide · 1.5px stroke · 22px · currentColor. No fill icons. No emoji.</div>
  <script>lucide.createIcons();</script>
</body></html>
