<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shell.css">
<style>
.opt { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--border-1); border-radius:6px; background:var(--bg-surface); }
.opt + .opt { margin-top:6px; }
.opt .marker { font:500 12px/1 var(--font-mono); color:var(--fg-3); padding-top:2px; }
.opt.correct { border-color: var(--sage); background: rgba(63,107,92,0.04); }
.opt .text { font:400 14px/1.5 var(--font-sans); color:var(--fg-1); }
</style>
</head>
<body class="ds-base">
  <div style="background:var(--bg-surface);border:1px solid var(--border-1);border-radius:8px;padding:20px">
    <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:8px">
      <span class="eyebrow">Prelims · GS-2 Polity</span>
      <span class="mono" style="font-size:11px;color:var(--fg-3)">PYQ 2019 pattern</span>
    </div>
    <div style="font:500 15px/1.5 var(--font-sans);margin-bottom:12px">Which of the following best describes cooperative federalism in the Indian context?</div>
    <div class="opt"><span class="marker">A</span><span class="text">Centre and States compete for legislative supremacy</span></div>
    <div class="opt correct"><span class="marker">B</span><span class="text">Centre and States act in coordinated pursuit of common goals</span></div>
    <div class="opt"><span class="marker">C</span><span class="text">States have absolute autonomy in all matters</span></div>
  </div>
</body></html>
