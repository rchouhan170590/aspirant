<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shell.css">
<style>
.badge { font: 500 11px/1 var(--font-sans); text-transform: uppercase; letter-spacing: 0.08em; padding: 5px 10px; border-radius: 9999px; display: inline-flex; align-items:center; gap:6px; }
.b-ink { background: var(--ink); color: var(--paper-white); }
.b-sage { background: rgba(63,107,92,0.12); color: var(--sage); }
.b-marigold { background: rgba(217,119,6,0.12); color: var(--marigold); }
.b-vermillion { background: rgba(178,58,58,0.10); color: var(--vermillion); }
.b-outline { background: transparent; border: 1px solid var(--border-1); color: var(--fg-2); }
.dot { width: 5px; height: 5px; border-radius: 9999px; background: currentColor; }
</style>
</head>
<body class="ds-base">
  <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">
    <span class="badge b-ink"><span class="dot"></span>Today</span>
    <span class="badge b-sage"><span class="dot"></span>Verified</span>
    <span class="badge b-marigold"><span class="dot"></span>Essay angle</span>
    <span class="badge b-vermillion"><span class="dot"></span>Weak area</span>
    <span class="badge b-outline">PYQ 2019</span>
    <span class="badge b-outline">Anthro P1</span>
  </div>
  <div class="meta" style="margin-top:14px">Pill badges · 11px uppercase Inter 500 · 0.08em tracking · status only, never decorative.</div>
</body></html>
